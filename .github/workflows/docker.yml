name: Publish image

# Builds the web app and pushes it to this repo's GitHub Container Registry package.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vibecoder9527/formamorph:latest
            ghcr.io/vibecoder9527/formamorph:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
