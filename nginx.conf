server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
  }

  # Alpine's mime.types maps .js only. A module script served as octet-stream is refused by the browser,
  # which is how the ONNX runtime loader fails with "Failed to fetch dynamically imported module".
  location ~* \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
